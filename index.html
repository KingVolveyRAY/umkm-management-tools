<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eee5d6" data-light="#eee5d6" data-dark="#111916" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kelola" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style media="screen">
      html { color-scheme: light; background: #eee5d6; }
      html[data-theme="dark"] { color-scheme: dark; background: #111916; }
    </style>
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('kelola:theme'); } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        const theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        const browserColor = document.querySelector('meta[name="theme-color"]');
        browserColor.content = browserColor.dataset[theme];
      })();
    </script>
    <link rel="icon" type="image/png" href="/kelola-icon.png" />
    <link rel="apple-touch-icon" href="/kelola-icon.png" />
    <meta name="description" content="Kelola penjualan, kasir, dan absensi untuk usaha Anda." />
    <title>Kelola — Ruang kerja UMKM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
