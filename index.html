<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf2f1" data-light="#edf2f1" data-dark="#111916" />
    <style media="screen">html[data-theme="dark"] { color-scheme: dark; background: #111916; }</style>
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('kelola:theme'); } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        const theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        const browserColor = document.querySelector('meta[name="theme-color"]');
        browserColor.content = browserColor.dataset[theme];
      })();
    </script>
    <link rel="icon" type="image/png" href="/kelola-icon.png" />
    <link rel="apple-touch-icon" href="/kelola-icon.png" />
    <meta name="description" content="Kelola penjualan, kasir, dan absensi untuk usaha Anda." />
    <title>Kelola — Ruang kerja UMKM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
